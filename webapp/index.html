<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0a10" />
  <title>Крипта</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <div class="app" id="app">
    <header class="top">
      <div class="logo">КРИПТА<span>.</span></div>
      <div class="floor">
        <b id="floorNum">1</b><i>/10</i>
        <em id="floorName">Верхние катакомбы</em>
      </div>
    </header>

    <section class="hud">
      <div class="hp-row">
        <span class="hp-label">HP</span>
        <div class="hp-bar">
          <div class="hp-fill" id="hpFill"></div>
          <div class="hp-ticks" aria-hidden="true"></div>
        </div>
        <span class="hp-num" id="hpNum">30/30</span>
      </div>
      <div class="stats">
        <div class="stat"><b id="atk">5</b><span>атака</span></div>
        <div class="stat"><b id="def">0</b><span>защита</span></div>
        <div class="stat"><b id="gold">0</b><span>золото</span></div>
        <div class="stat"><b id="kills">0</b><span>убито</span></div>
      </div>
    </section>

    <div class="map" id="map" aria-hidden="true"></div>

    <main class="card" id="card">
      <div class="card-glow" aria-hidden="true"></div>
      <div class="room-tag" id="roomTag">этаж 1 · комната 1/4</div>
      <div class="sigil">
        <div class="sigil-ring" aria-hidden="true"></div>
        <div class="card-emoji" id="emoji">🕯</div>
      </div>
      <h1 class="card-title" id="title">Крипта</h1>
      <p class="card-text" id="text">Загрузка…</p>
      <p class="intent hidden" id="intent"></p>
      <div class="status" id="status"></div>
      <div class="mhp hidden" id="mhp">
        <div class="mhp-bar"><div class="mhp-fill" id="mhpFill"></div></div>
        <span class="mhp-num" id="mhpNum"></span>
      </div>
      <div class="fx" id="fx" aria-hidden="true"></div>
    </main>

    <div class="actions" id="actions"></div>

    <footer class="inv">
      <div class="chip" id="weapon">⚔️ Кулаки</div>
      <div class="chip" id="armor">🛡 Лохмотья</div>
      <div class="chip" id="potions">🧪 ×2</div>
    </footer>
  </div>

  <div class="overlay hidden" id="overlay">
    <div class="overlay-card">
      <div class="overlay-emoji" id="ovEmoji">💀</div>
      <h2 id="ovTitle">Ты погиб</h2>
      <p id="ovText"></p>
      <div class="overlay-stats" id="ovStats"></div>
      <button class="btn primary" id="ovNew">🔁 Новый забег</button>
      <button class="btn" id="ovDaily">📅 Забег дня</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/static/app.js"></script>
</body>
</html>
